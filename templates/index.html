<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Jeu du Menteur - 64 Cartes</title>
  <style>
    body {
      background-color: #2e7d32;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 25px 20px;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    #ecran-bloque {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-color: rgba(20, 20, 20, 0.95);
      color: white;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      z-index: 100;
      padding: 20px;
      box-sizing: border-box;
    }

    #ecran-bloque h1 { color: #ef5350; margin-bottom: 10px; }

    #en-tete {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    #ligne-badges {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    #badge-role {
      background-color: #ffd54f;
      color: #212121;
      font-weight: bold;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 15px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }

    #badge-tour {
      background-color: #1565c0;
      color: #ffffff;
      font-weight: bold;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 15px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }

    #badge-tour.actif {
      background-color: #ff6f00;
    }

    #info-action {
      color: white;
      background: rgba(0, 0, 0, 0.35);
      padding: 10px 20px;
      border-radius: 16px;
      font-size: 15px;
      text-align: center;
      line-height: 1.4;
    }

    #zone-centrale {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      flex-grow: 1;
      width: 100%;
    }

    #info-tas {
      color: white;
      background: rgba(0, 0, 0, 0.25);
      padding: 5px 14px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: bold;
    }

    .carte {
      display: none; 
      width: 160px;
      height: 230px;
      background-color: #ffffff;
      border-radius: 14px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.35);
      justify-content: center;
      align-items: center;
    }

    .carte.visible {
      display: flex;
      animation: poserCarte 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes poserCarte {
      from { transform: translateY(30px) scale(1.15); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }

    .rouge { color: #d32f2f; }
    .noir { color: #212121; }

    .symbole { font-size: 90px; line-height: 1; user-select: none; }
    #carte-coeur .symbole::before { content: "♥"; }
    #carte-carreau .symbole::before { content: "♦"; }
    #carte-trefle .symbole::before { content: "♣"; }
    #carte-pique .symbole::before { content: "♠"; }

    #carte-dos {
      background-color: #1565c0;
      border: 7px solid #ffffff;
      box-sizing: border-box;
      background-image: repeating-linear-gradient(
        45deg, rgba(255, 255, 255, 0.15) 0px, rgba(255, 255, 255, 0.15) 10px,
        transparent 10px, transparent 20px
      ),
      repeating-linear-gradient(
        -45deg, rgba(255, 255, 255, 0.15) 0px, rgba(255, 255, 255, 0.15) 10px,
        transparent 10px, transparent 20px
      );
    }

    #btn-menteur {
      background-color: #d32f2f;
      color: white;
      border: 3px solid #ffffff;
      padding: 12px 28px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    #btn-menteur:hover:not(:disabled) {
      transform: scale(1.06);
      background-color: #b71c1c;
    }

    #btn-menteur:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    #btn-rejouer {
      display: none;
      background-color: #ffd54f;
      color: #212121;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
    }

    #main-joueur {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .emplacement-carte {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .compteur-carte {
      background-color: rgba(0, 0, 0, 0.45);
      color: #ffffff;
      font-weight: bold;
      font-size: 16px;
      padding: 4px 14px;
      border-radius: 12px;
      min-width: 24px;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .bouton-carte {
      width: 90px;
      height: 130px;
      background-color: #ffffff;
      border: none;
      border-radius: 10px;
      box-shadow: 0 5px 10px rgba(0, 0, 0, 0.25);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 48px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
    }

    .bouton-carte:hover:not(:disabled) {
      transform: translateY(-12px);
      box-shadow: 0 12px 18px rgba(0, 0, 0, 0.35);
    }

    .bouton-carte:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div id="ecran-bloque">
    <h1>Accès bloqué</h1>
    <p id="texte-blocage">La salle est pleine (2/2 joueurs connectés).</p>
    <p style="font-size: 14px; color: #aaa;">Veuillez patienter qu'un joueur quitte la partie puis rechargez la page.</p>
  </div>

  <div id="en-tete">
    <div id="ligne-badges">
      <div id="badge-role">Connexion au serveur...</div>
      <div id="badge-tour">En attente...</div>
    </div>
    <div id="info-action">En attente...</div>
  </div>

  <div id="zone-centrale">
    <div id="info-tas">Tas au centre : 0 carte | Adversaire : 0 carte</div>

    <div id="tapis-de-jeu">
      <div id="carte-coeur" class="carte rouge"><div class="symbole"></div></div>
      <div id="carte-carreau" class="carte rouge"><div class="symbole"></div></div>
      <div id="carte-trefle" class="carte noir"><div class="symbole"></div></div>
      <div id="carte-pique" class="carte noir"><div class="symbole"></div></div>
      <div id="carte-dos" class="carte"></div>
    </div>

    <button id="btn-menteur" onclick="crierMenteur()" disabled>Menteur !</button>
    <button id="btn-rejouer" onclick="relancerPartie()">Rejouer une partie</button>
  </div>

  <div id="main-joueur">
    <div class="emplacement-carte">
      <span id="compte-coeur" class="compteur-carte">0</span>
      <button id="btn-coeur" class="bouton-carte rouge" onclick="envoyerChoix('coeur')" disabled>♥</button>
    </div>

    <div class="emplacement-carte">
      <span id="compte-carreau" class="compteur-carte">0</span>
      <button id="btn-carreau" class="bouton-carte rouge" onclick="envoyerChoix('carreau')" disabled>♦</button>
    </div>

    <div class="emplacement-carte">
      <span id="compte-trefle" class="compteur-carte">0</span>
      <button id="btn-trefle" class="bouton-carte noir" onclick="envoyerChoix('trefle')" disabled>♣</button>
    </div>

    <div class="emplacement-carte">
      <span id="compte-pique" class="compteur-carte">0</span>
      <button id="btn-pique" class="bouton-carte noir" onclick="envoyerChoix('pique')" disabled>♠</button>
    </div>
  </div>

  <script>
    const protocole = window.location.protocol === "https:" ? "wss:" : "ws:";
    const ws = new WebSocket(`${protocole}//${window.location.host}/ws`);
    
    const badgeRole = document.getElementById("badge-role");
    const badgeTour = document.getElementById("badge-tour");
    const infoAction = document.getElementById("info-action");
    const btnMenteur = document.getElementById("btn-menteur");
    const btnRejouer = document.getElementById("btn-rejouer");

    let monRole = "";
    let duelActif = false;
    let cEstMonTour = false;
    let maMain = { coeur: 0, carreau: 0, trefle: 0, pique: 0 };

    const nomsFr = {
      coeur: "Cœur ♥",
      carreau: "Carreau ♦",
      trefle: "Trèfle ♣",
      pique: "Pique ♠"
    };

    function mettreAJourBoutons() {
      const types = ["coeur", "carreau", "trefle", "pique"];
      types.forEach(type => {
        const nb = maMain[type];
        document.getElementById("compte-" + type).textContent = nb;
        document.getElementById("btn-" + type).disabled = !(duelActif && cEstMonTour && nb > 0);
      });
    }

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);

      if (data.type === "complet") {
        document.getElementById("texte-blocage").textContent = data.message;
        document.getElementById("ecran-bloque").style.display = "flex";
        duelActif = false;
        mettreAJourBoutons();
      }

      else if (data.type === "attribution") {
        monRole = data.role;
        badgeRole.textContent = (data.role === "J1") ? "Vous êtes le Joueur 1" : "Vous êtes le Joueur 2";
        afficherCarte(data.carte);
      }

      else if (data.type === "maj_main") {
        maMain = data.main;
        mettreAJourBoutons();
      }

      else if (data.type === "statut_salle") {
        if (data.nb_joueurs < 2) {
          duelActif = false;
          cEstMonTour = false;
          maMain = { coeur: 0, carreau: 0, trefle: 0, pique: 0 };
          badgeTour.textContent = "En attente (1/2)";
          badgeTour.classList.remove("actif");
          infoAction.textContent = "En attente de l'autre joueur (1/2)...";
          btnMenteur.disabled = true;
          btnRejouer.style.display = "none";
          afficherCarte("dos");
        } else {
          duelActif = true;
        }
        mettreAJourBoutons();
      }

Utilisez le code avec précaution.
else if (data.type === "etat_jeu") {
afficherCarte(data.carte);
const cartesAdv = (monRole === "J1") ? data.nb_j2 : data.nb_j1;
document.getElementById("info-tas").textContent = Tas au centre : ${data.taille_tas} carte(s) | Adversaire : ${cartesAdv} carte(s);
let texte = data.info;
if (data.annonce && !data.partie_finie) {
texte += <br><strong>Carte annoncée : ${nomsFr[data.annonce]}</strong>;
}
infoAction.innerHTML = texte;
if (data.partie_finie) {
cEstMonTour = false;
badgeTour.textContent = "Partie terminée";
badgeTour.classList.remove("actif");
btnMenteur.disabled = true;
btnRejouer.style.display = "inline-block";
} else {
btnRejouer.style.display = "none";
cEstMonTour = (data.tour === monRole);
if (cEstMonTour) {
badgeTour.textContent = "C'est votre tour !";
badgeTour.classList.add("actif");
} else {
badgeTour.textContent = "Tour de l'adversaire...";
badgeTour.classList.remove("actif");
}
// Bouton Menteur actif uniquement si c'est mon tour et qu'il y a au moins 1 carte face cachée (tas >= 2)
btnMenteur.disabled = !(cEstMonTour && data.taille_tas >= 2);
}
mettreAJourBoutons();
}
};
ws.onclose = () => {
if (document.getElementById("ecran-bloque").style.display !== "flex") {
badgeRole.textContent = "Déconnecté du serveur";
badgeRole.style.backgroundColor = "#ef5350";
badgeRole.style.color = "white";
duelActif = false;
btnMenteur.disabled = true;
mettreAJourBoutons();
}
};
function envoyerChoix(nomCarte) {
if (ws.readyState === WebSocket.OPEN && duelActif && cEstMonTour && maMain[nomCarte] > 0) {
ws.send(JSON.stringify({ action: "jouer_carte", valeur: nomCarte }));
}
}
function crierMenteur() {
if (ws.readyState === WebSocket.OPEN && duelActif && cEstMonTour) {
ws.send(JSON.stringify({ action: "menteur" }));
}
}
function relancerPartie() {
if (ws.readyState === WebSocket.OPEN) {
ws.send(JSON.stringify({ action: "rejouer" }));
}
}
function afficherCarte(nomCarte) {
document.querySelectorAll('.carte').forEach(c => c.classList.remove('visible'));
const carteCible = document.getElementById('carte-' + nomCarte);
if (carteCible) {
void carteCible.offsetWidth;
carteCible.classList.add('visible');
}
}

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Duel de Cartes</title>
  <style>
    body {
      background-color: #2e7d32;
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* --- ÉCRAN 1 : CONNEXION --- */
    #ecran-connexion {
      background-color: #ffffff;
      padding: 35px;
      border-radius: 14px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
      text-align: center;
      width: 310px;
    }

    #ecran-connexion h2 { margin-top: 0; color: #1b5e20; }

    #champ-pseudo {
      width: 100%;
      padding: 12px;
      margin: 15px 0;
      border: 2px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      box-sizing: border-box;
    }

    #btn-rejoindre {
      width: 100%;
      padding: 12px;
      background-color: #2e7d32;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    /* --- ÉCRAN 2 : CHOIX DE L'ADVERSAIRE (LOBBY) --- */
    #ecran-lobby {
      display: none;
      background-color: #ffffff;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
      width: 420px;
      max-width: 90vw;
    }

    #ecran-lobby h2 {
      margin-top: 0;
      color: #1b5e20;
      border-bottom: 2px solid #e8f5e9;
      padding-bottom: 10px;
    }

    #alerte-defi {
      display: none;
      background-color: #fff8e1;
      border: 2px solid #ffb300;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      text-align: center;
    }

    .actions-defi {
      margin-top: 10px;
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .btn-accepter {
      background-color: #2e7d32;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-refuser {
      background-color: #d32f2f;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
    }

    #liste-adversaires {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .ligne-joueur {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      border-bottom: 1px solid #eeeeee;
    }

    .ligne-joueur:last-child { border-bottom: none; }

    .btn-defier {
      background-color: #1565c0;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-defier:hover { background-color: #0d47a1; }

    .statut-occupe {
      color: #757575;
      font-style: italic;
      font-size: 14px;
    }

    /* --- ÉCRAN 3 : ARÈNE DE DUEL --- */
    #ecran-jeu {
      display: none;
      width: 100%;
      min-height: 100vh;
      padding: 25px;
      box-sizing: border-box;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }

    #barre-duel {
      width: 100%;
      max-width: 700px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.3);
      padding: 12px 20px;
      border-radius: 12px;
      color: white;
      box-sizing: border-box;
    }

    #btn-quitter-duel {
      background-color: #d32f2f;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    #info-action {
      color: white;
      background: rgba(0, 0, 0, 0.25);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 15px;
      margin-top: 15px;
    }

    #tapis-de-jeu {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-grow: 1;
    }

    .carte {
      display: none; 
      width: 160px;
      height: 230px;
      background-color: #ffffff;
      border-radius: 14px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.35);
      justify-content: center;
      align-items: center;
    }

    .carte.visible {
      display: flex;
      animation: poserCarte 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes poserCarte {
      from { transform: translateY(30px) scale(1.15); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }

    .rouge { color: #d32f2f; }
    .noir { color: #212121; }

    .symbole { font-size: 90px; line-height: 1; user-select: none; }
    #carte-coeur .symbole::before { content: "♥"; }
    #carte-carreau .symbole::before { content: "♦"; }
    #carte-trefle .symbole::before { content: "♣"; }
    #carte-pique .symbole::before { content: "♠"; }

    #carte-dos {
      background-color: #1565c0;
      border: 7px solid #ffffff;
      box-sizing: border-box;
      background-image: repeating-linear-gradient(
        45deg, rgba(255, 255, 255, 0.15) 0px, rgba(255, 255, 255, 0.15) 10px,
        transparent 10px, transparent 20px
      ),
      repeating-linear-gradient(
        -45deg, rgba(255, 255, 255, 0.15) 0px, rgba(255, 255, 255, 0.15) 10px,
        transparent 10px, transparent 20px
      );
    }

    #main-joueur {
      display: flex;
      gap: 18px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .bouton-carte {
      width: 90px;
      height: 130px;
      background-color: #ffffff;
      border: none;
      border-radius: 10px;
      box-shadow: 0 5px 10px rgba(0, 0, 0, 0.25);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 48px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .bouton-carte:hover {
      transform: translateY(-12px);
      box-shadow: 0 12px 18px rgba(0, 0, 0, 0.35);
    }

    .bouton-carte.actif {
      outline: 3px solid #ffd54f;
      transform: translateY(-8px);
    }
  </style>
</head>
<body>

  <!-- ÉCRAN 1 : Choix du pseudo -->
  <div id="ecran-connexion">
    <h2>Entrez votre pseudo</h2>
    <input type="text" id="champ-pseudo" placeholder="Votre pseudo..." maxlength="15" onkeypress="if(event.key === 'Enter') rejoindreSalon()">
    <button id="btn-rejoindre" onclick="rejoindreSalon()">Continuer</button>
  </div>

  <!-- ÉCRAN 2 : Sélection d'un joueur à défier -->
  <div id="ecran-lobby">
    <h2>Choisir un adversaire</h2>
    
    <!-- Encadré d'invitation reçue -->
    <div id="alerte-defi">
      <div id="texte-defi"><strong>Joueur</strong> vous défie en duel !</div>
      <div class="actions-defi">
        <button class="btn-accepter" onclick="repondreDefi(true)">Accepter</button>
        <button class="btn-refuser" onclick="repondreDefi(false)">Refuser</button>
      </div>
    </div>

    <ul id="liste-adversaires">
      <li style="color: #777; text-align: center;">En attente d'autres joueurs...</li>
    </ul>
  </div>

  <!-- ÉCRAN 3 : Table de duel -->
  <div id="ecran-jeu">
    <div style="width: 100%; display: flex; flex-direction: column; align-items: center;">
      <div id="barre-duel">
        <span id="titre-duel">Duel : Moi vs Adversaire</span>
        <button id="btn-quitter-duel" onclick="quitterDuel()">Quitter le duel</button>
      </div>
      <div id="info-action">Posez une carte !</div>
    </div>

    <div id="tapis-de-jeu">
      <div id="carte-coeur" class="carte rouge"><div class="symbole"></div></div>
      <div id="carte-carreau" class="carte rouge"><div class="symbole"></div></div>
      <div id="carte-trefle" class="carte noir"><div class="symbole"></div></div>
      <div id="carte-pique" class="carte noir"><div class="symbole"></div></div>
      <div id="carte-dos" class="carte"></div>
    </div>

    <div id="main-joueur">
      <button id="btn-coeur" class="bouton-carte rouge" onclick="envoyerChoix('coeur')">♥</button>
      <button id="btn-carreau" class="bouton-carte rouge" onclick="envoyerChoix('carreau')">♦</button>
      <button id="btn-trefle" class="bouton-carte noir" onclick="envoyerChoix('trefle')">♣</button>
      <button id="btn-pique" class="bouton-carte noir" onclick="envoyerChoix('pique')">♠</button>
    </div>
  </div>

  <script>
    const protocole = window.location.protocol === "https:" ? "wss:" : "ws:";
    const ws = new WebSocket(`${protocole}//${window.location.host}/ws`);
    
    let monId = "";
    let monPseudo = "";
    let challengerEnAttenteId = null;

    function afficherEcran(nomEcran) {
      document.getElementById("ecran-connexion").style.display = "none";
      document.getElementById("ecran-lobby").style.display = "none";
      document.getElementById("ecran-jeu").style.display = "none";
      document.getElementById(nomEcran).style.display = (nomEcran === "ecran-jeu") ? "flex" : "block";
    }

    function rejoindreSalon() {
      const saisie = document.getElementById("champ-pseudo").value.trim();
      if (!saisie) {
        alert("Veuillez entrer un pseudo.");
        return;
      }
      if (ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ action: "rejoindre", pseudo: saisie }));
      } else {
        alert("Connexion au serveur en cours, réessayez dans une seconde.");
      }
    }

    function defierJoueur(cibleId, ciblePseudo) {
      ws.send(JSON.stringify({ action: "defier", cible_id: cibleId }));
      alert(`Invitation envoyée à ${ciblePseudo} ! En attente de sa réponse...`);
    }

    function repondreDefi(accepte) {
      if (challengerEnAttenteId) {
        ws.send(JSON.stringify({
          action: "repondre_defi",
          de_id: challengerEnAttenteId,
          accepte: accepte
        }));
        document.getElementById("alerte-defi").style.display = "none";
        challengerEnAttenteId = null;
      }
    }

    function quitterDuel() {
      ws.send(JSON.stringify({ action: "quitter_duel" }));
    }

    ws.onmessage = (event) => {
Utilisez le code avec précaution.
const data = JSON.parse(event.data);
// 1. Confirmation de connexion -> Passage à l'écran de choix d'adversaire
if (data.type === "bienvenue") {
monId = data.id;
monPseudo = data.pseudo;
afficherEcran("ecran-lobby");
}
// 2. Mise à jour de la liste des joueurs dans le salon
else if (data.type === "liste_joueurs") {
const ul = document.getElementById("liste-adversaires");
ul.innerHTML = "";
const autresJoueurs = data.joueurs.filter(j => j.id !== monId);
if (autresJoueurs.length === 0) {
ul.innerHTML = 'Aucun autre joueur connecté pour le moment.';
return;
}
autresJoueurs.forEach(j => {
const li = document.createElement("li");
li.className = "ligne-joueur";
const spanNom = document.createElement("span");
spanNom.textContent = j.pseudo;
spanNom.style.fontWeight = "bold";
li.appendChild(spanNom);
if (j.en_duel) {
const spanStatut = document.createElement("span");
spanStatut.className = "statut-occupe";
spanStatut.textContent = "En duel...";
li.appendChild(spanStatut);
} else {
const btn = document.createElement("button");
btn.className = "btn-defier";
btn.textContent = "Défier";
btn.onclick = () => defierJoueur(j.id, j.pseudo);
li.appendChild(btn);
}
ul.appendChild(li);
});
}
// 3. Réception d'une demande de duel
else if (data.type === "defi_recu") {
challengerEnAttenteId = data.de_id;
document.getElementById("texte-defi").innerHTML = <strong>${data.de_pseudo}</strong> vous défie en duel !;
document.getElementById("alerte-defi").style.display = "block";
}
// 4. Défi refusé par l'adversaire
else if (data.type === "defi_refuse") {
alert(${data.par} a refusé votre défi.);
}
// 5. Début du duel -> Passage à l'écran de jeu
else if (data.type === "debut_duel") {
document.getElementById("alerte-defi").style.display = "none";
document.getElementById("titre-duel").textContent = ${monPseudo} VS ${data.adversaire};
document.getElementById("info-action").textContent = "Le duel commence ! Choisissez une carte.";
afficherCarte("dos");
afficherEcran("ecran-jeu");
}
// 6. Carte jouée pendant le duel
else if (data.type === "carte_duel") {
afficherCarte(data.valeur);
document.getElementById("info-action").textContent = Carte posée par ${data.par};
}
// 7. Fin du duel -> Retour à l'écran de choix d'adversaire
else if (data.type === "fin_duel") {
alert(data.raison);
afficherEcran("ecran-lobby");
}
};
function envoyerChoix(nomCarte) {
if (ws.readyState === WebSocket.OPEN) {
ws.send(JSON.stringify({ action: "jouer_carte", valeur: nomCarte }));
}
}
function afficherCarte(nomCarte) {
document.querySelectorAll('.carte').forEach(c => c.classList.remove('visible'));
document.querySelectorAll('.bouton-carte').forEach(b => b.classList.remove('actif'));
const carteCible = document.getElementById('carte-' + nomCarte);
if (carteCible) {
void carteCible.offsetWidth;
carteCible.classList.add('visible');
}
const boutonCible = document.getElementById('btn-' + nomCarte);
if (boutonCible) {
boutonCible.classList.add('actif');
}
}

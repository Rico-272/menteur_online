<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Jeu du Menteur - Duel</title>
  <style>
    body {
      background-color: #2e7d32;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    #ecran-bloque {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-color: rgba(20, 20, 20, 0.95);
      color: white;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      z-index: 100;
      padding: 20px;
    }

    #ecran-bloque h1 { color: #ef5350; }

    /* Barre supérieure d'informations */
    #en-tete {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 100%;
      max-width: 650px;
    }

    #ligne-badges {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .badge {
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 14px;
      box-shadow: 0 3px 6px rgba(0,0,0,0.2);
    }

    #badge-role { background-color: #ffd54f; color: #212121; }
    #badge-adversaire { background-color: #ffffff; color: #212121; }
    #badge-tour { background-color: #1565c0; color: #ffffff; }
    #badge-tour.mon-tour { background-color: #ff6f00; color: #ffffff; }

    #bandeau-annonce {
      background-color: rgba(0, 0, 0, 0.45);
      color: #fff;
      padding: 10px 22px;
      border-radius: 12px;
      font-size: 16px;
      text-align: center;
      line-height: 1.4;
    }

    /* Zone centrale : Tapis + Bouton Menteur */
    #zone-centrale {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      flex-grow: 1;
    }

    #info-tas {
      color: #e8f5e9;
      font-weight: bold;
      font-size: 15px;
      background: rgba(0,0,0,0.25);
      padding: 5px 14px;
      border-radius: 15px;
    }

    .carte {
      display: none; 
      width: 150px;
      height: 215px;
      background-color: #ffffff;
      border-radius: 14px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.35);
      justify-content: center;
      align-items: center;
    }

    .carte.visible {
      display: flex;
      animation: poserCarte 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes poserCarte {
      from { transform: translateY(25px) scale(1.12); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }

    .rouge { color: #d32f2f; }
    .noir { color: #212121; }

    .symbole { font-size: 85px; line-height: 1; user-select: none; }
    #carte-coeur .symbole::before { content: "♥"; }
    #carte-carreau .symbole::before { content: "♦"; }
    #carte-trefle .symbole::before { content: "♣"; }
    #carte-pique .symbole::before { content: "♠"; }

    #carte-dos {
      background-color: #1565c0;
      border: 7px solid #ffffff;
      box-sizing: border-box;
      background-image: repeating-linear-gradient(
        45deg, rgba(255, 255, 255, 0.15) 0px, rgba(255, 255, 255, 0.15) 10px,
        transparent 10px, transparent 20px
      ),
      repeating-linear-gradient(
        -45deg, rgba(255, 255, 255, 0.15) 0px, rgba(255, 255, 255, 0.15) 10px,
        transparent 10px, transparent 20px
      );
    }

    /* Bouton Menteur & Rejouer */
    #btn-menteur {
      background-color: #d32f2f;
      color: white;
      border: 3px solid #ffffff;
      padding: 12px 28px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(0,0,0,0.35);
      transition: transform 0.15s ease, background-color 0.15s ease;
    }

    #btn-menteur:hover:not(:disabled) {
      background-color: #b71c1c;
      transform: scale(1.06);
    }

    #btn-menteur:disabled {
      background-color: #757575;
      border-color: #bdbdbd;
      opacity: 0.45;
      cursor: not-allowed;
    }

    #btn-rejouer {
      display: none;
      background-color: #ffd54f;
      color: #212121;
      border: none;
      padding: 12px 26px;
      font-size: 17px;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 5px 12px rgba(0,0,0,0.3);
    }

    /* Main du joueur en bas */
    #main-joueur {
      display: flex;
      gap: 18px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .emplacement-carte {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .compteur-carte {
      background-color: rgba(0, 0, 0, 0.5);
      color: #ffffff;
      font-weight: bold;
      font-size: 15px;
      padding: 4px 14px;
      border-radius: 12px;
      min-width: 22px;
      text-align: center;
    }

    .bouton-carte {
      width: 85px;
      height: 120px;
      background-color: #ffffff;
      border: none;
      border-radius: 10px;
      box-shadow: 0 5px 10px rgba(0, 0, 0, 0.25);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 44px;
      cursor: pointer;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .bouton-carte:hover:not(:disabled) {
      transform: translateY(-10px);
    }

    .bouton-carte:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div id="ecran-bloque">
    <h1>Accès bloqué</h1>
    <p id="texte-blocage">La salle est pleine (2/2 joueurs connectés).</p>
  </div>

  <!-- En-tête -->
  <div id="en-tete">
    <div id="ligne-badges">
      <span id="badge-role" class="badge">Connexion...</span>
      <span id="badge-adversaire" class="badge">Adversaire : 0 carte</span>
      <span id="badge-tour" class="badge">En attente...</span>
    </div>
    <div id="bandeau-annonce">En attente des joueurs...</div>
  </div>

  <!-- Centre du tapis -->
  <div id="zone-centrale">
    <div id="info-tas">Tas au centre : 0 carte</div>

    <div id="tapis-de-jeu">
      <div id="carte-coeur" class="carte rouge"><div class="symbole"></div></div>
      <div id="carte-carreau" class="carte rouge"><div class="symbole"></div></div>
      <div id="carte-trefle" class="carte noir"><div class="symbole"></div></div>
      <div id="carte-pique" class="carte noir"><div class="symbole"></div></div>
      <div id="carte-dos" class="carte visible"></div>
    </div>

    <button id="btn-menteur" onclick="crierMenteur()" disabled>Menteur !</button>
    <button id="btn-rejouer" onclick="relancerPartie()">Rejouer une partie</button>
  </div>

  <!-- Main du joueur -->
  <div id="main-joueur">
    <div class="emplacement-carte">
      <span id="compte-coeur" class="compteur-carte">0</span>
      <button id="btn-coeur" class="bouton-carte rouge" onclick="envoyerChoix('coeur')" disabled>♥</button>
    </div>

    <div class="emplacement-carte">
      <span id="compte-carreau" class="compteur-carte">0</span>
      <button id="btn-carreau" class="bouton-carte rouge" onclick="envoyerChoix('carreau')" disabled>♦</button>
    </div>

    <div class="emplacement-carte">
      <span id="compte-trefle" class="compteur-carte">0</span>
      <button id="btn-trefle" class="bouton-carte noir" onclick="envoyerChoix('trefle')" disabled>♣</button>
    </div>

    <div class="emplacement-carte">
      <span id="compte-pique" class="compteur-carte">0</span>
      <button id="btn-pique" class="bouton-carte noir" onclick="envoyerChoix('pique')" disabled>♠</button>
    </div>
  </div>

  <script>
    const protocole = window.location.protocol === "https:" ? "wss:" : "ws:";
    const ws = new WebSocket(`${protocole}//${window.location.host}/ws`);

    const nomsCartes = {
      coeur: "Cœur ♥",
      carreau: "Carreau ♦",
      trefle: "Trèfle ♣",
      pique: "Pique ♠"
    };

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);

      if (data.type === "complet") {
        document.getElementById("texte-blocage").textContent = data.message;
        document.getElementById("ecran-bloque").style.display = "flex";
        return;
      }

      if (data.type === "mise_a_jour") {
        const estMonTour = (data.nb_joueurs === 2 && !data.partie_terminee && data.tour === data.mon_role);

        // Badges du haut
        document.getElementById("badge-role").textContent = (data.mon_role === "J1") ? "Vous : Joueur 1" : "Vous : Joueur 2";
        document.getElementById("badge-adversaire").textContent = `Adversaire : ${data.cartes_adversaire} carte(s)`;
        
        const badgeTour = document.getElementById("badge-tour");
        if (data.nb_joueurs < 2) {
          badgeTour.textContent = "En attente (1/2)";
          badgeTour.classList.remove("mon-tour");
        } else if (data.partie_terminee) {
          badgeTour.textContent = "Partie terminée";
          badgeTour.classList.remove("mon-tour");
        } else if (estMonTour) {
          badgeTour.textContent = "C'EST VOTRE TOUR !";
          badgeTour.classList.add("mon-tour");
        } else {
          badgeTour.textContent = "Tour de l'adversaire...";
          badgeTour.classList.remove("mon-tour");
        }

        // Bandeau d'annonce et tas
        let texteBandeau = data.message;
        if (data.carte_annoncee && !data.partie_terminee) {
          texteBandeau += `<br><strong>Carte annoncée pour ce tour : ${nomsCartes[data.carte_annoncee]}</strong>`;
        }
        document.getElementById("bandeau-annonce").innerHTML = texteBandeau;
        document.getElementById("info-tas").textContent = `Tas au centre : ${data.taille_tas} carte(s)`;

        // Carte affichée au centre
        afficherCarte(data.carte_visuelle);

        // Bouton Menteur & Bouton Rejouer
Utilisez le code avec précaution.
document.getElementById("btn-menteur").disabled = !data.peut_crier_menteur;
document.getElementById("btn-rejouer").style.display = data.partie_terminee ? "inline-block" : "none";
// Mise à jour des 4 compteurs et activation des cartes jouables
["coeur", "carreau", "trefle", "pique"].forEach(type => {
const nb = data.ma_main[type];
document.getElementById("compte-" + type).textContent = nb;
document.getElementById("btn-" + type).disabled = !(estMonTour && nb > 0);
});
}
};
function envoyerChoix(nomCarte) {
if (ws.readyState === WebSocket.OPEN) {
ws.send(JSON.stringify({ action: "jouer_carte", valeur: nomCarte }));
}
}
function crierMenteur() {
if (ws.readyState === WebSocket.OPEN) {
ws.send(JSON.stringify({ action: "menteur" }));
}
}
function relancerPartie() {
if (ws.readyState === WebSocket.OPEN) {
ws.send(JSON.stringify({ action: "rejouer" }));
}
}
function afficherCarte(nomCarte) {
document.querySelectorAll('.carte').forEach(c => c.classList.remove('visible'));
const carteCible = document.getElementById('carte-' + nomCarte);
if (carteCible) {
void carteCible.offsetWidth;
carteCible.classList.add('visible');
}
}

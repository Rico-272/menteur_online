<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Jeu de cartes multijoueur</title>
  <style>
    body {
      background-color: #2e7d32;
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* --- ÉCRAN 1 : CONNEXION --- */
    #ecran-connexion {
      background-color: #ffffff;
      padding: 35px;
      border-radius: 14px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
      text-align: center;
      width: 300px;
    }

    #ecran-connexion h2 {
      margin-top: 0;
      color: #1b5e20;
    }

    #champ-pseudo {
      width: 100%;
      padding: 12px;
      margin: 15px 0;
      border: 2px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      box-sizing: border-box;
    }

    #champ-pseudo:focus {
      outline: none;
      border-color: #2e7d32;
    }

    #btn-rejoindre {
      width: 100%;
      padding: 12px;
      background-color: #2e7d32;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #btn-rejoindre:hover {
      background-color: #1b5e20;
    }

    /* --- ÉCRAN 2 : SALLE DE JEU --- */
    #ecran-jeu {
      display: none; /* Caché tant que le pseudo n'est pas validé */
      width: 100%;
      min-height: 100vh;
      padding: 25px;
      box-sizing: border-box;
      flex-direction: row;
      gap: 20px;
    }

    /* Panneau de gauche : liste des joueurs */
    #panneau-joueurs {
      width: 220px;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 12px;
      padding: 20px;
      color: white;
      display: flex;
      flex-direction: column;
    }

    #panneau-joueurs h3 {
      margin-top: 0;
      font-size: 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      padding-bottom: 10px;
    }

    #liste-joueurs {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    #liste-joueurs li {
      padding: 8px 10px;
      margin-bottom: 6px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #liste-joueurs li::before {
      content: "●";
      color: #69f0ae;
      font-size: 12px;
    }

    /* Zone principale : tapis + cartes en main */
    #zone-principale {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }

    #info-action {
      color: white;
      background: rgba(0, 0, 0, 0.3);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 14px;
    }

    #tapis-de-jeu {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-grow: 1;
    }

    .carte {
      display: none; 
      width: 160px;
      height: 230px;
      background-color: #ffffff;
      border-radius: 14px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.35);
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .carte.visible {
      display: flex;
      animation: poserCarte 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes poserCarte {
      from { transform: translateY(30px) scale(1.15); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }

    .rouge { color: #d32f2f; }
    .noir { color: #212121; }

    .symbole {
      font-size: 90px;
      line-height: 1;
      user-select: none;
    }

    #carte-coeur .symbole::before { content: "♥"; }
    #carte-carreau .symbole::before { content: "♦"; }
    #carte-trefle .symbole::before { content: "♣"; }
    #carte-pique .symbole::before { content: "♠"; }

    #carte-dos {
      background-color: #1565c0;
      border: 7px solid #ffffff;
      box-sizing: border-box;
      background-image: repeating-linear-gradient(
        45deg, rgba(255, 255, 255, 0.15) 0px, rgba(255, 255, 255, 0.15) 10px,
        transparent 10px, transparent 20px
      ),
      repeating-linear-gradient(
        -45deg, rgba(255, 255, 255, 0.15) 0px, rgba(255, 255, 255, 0.15) 10px,
        transparent 10px, transparent 20px
      );
    }

    #main-joueur {
      display: flex;
      gap: 18px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .bouton-carte {
      width: 90px;
      height: 130px;
      background-color: #ffffff;
      border: none;
      border-radius: 10px;
      box-shadow: 0 5px 10px rgba(0, 0, 0, 0.25);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 48px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .bouton-carte:hover {
      transform: translateY(-12px);
      box-shadow: 0 12px 18px rgba(0, 0, 0, 0.35);
    }

    .bouton-carte.actif {
      outline: 3px solid #ffd54f;
      transform: translateY(-8px);
    }
  </style>
</head>
<body>

  <!-- ÉCRAN 1 : Choix du pseudo -->
  <div id="ecran-connexion">
    <h2>Rejoindre la table</h2>
    <input type="text" id="champ-pseudo" placeholder="Entrez votre pseudo..." maxlength="15" onkeypress="if(event.key === 'Enter') rejoindrePartie()">
    <button id="btn-rejoindre" onclick="rejoindrePartie()">Entrer</button>
  </div>

  <!-- ÉCRAN 2 : Table de jeu et joueurs connectés -->
  <div id="ecran-jeu">
    <div id="panneau-joueurs">
      <h3>Joueurs (<span id="compteur-joueurs">0</span>)</h3>
      <ul id="liste-joueurs"></ul>
    </div>

    <div id="zone-principale">
      <div id="info-action">En attente d'une carte...</div>

      <div id="tapis-de-jeu">
        <div id="carte-coeur" class="carte rouge"><div class="symbole"></div></div>
        <div id="carte-carreau" class="carte rouge"><div class="symbole"></div></div>
        <div id="carte-trefle" class="carte noir"><div class="symbole"></div></div>
        <div id="carte-pique" class="carte noir"><div class="symbole"></div></div>
        <div id="carte-dos" class="carte"></div>
      </div>

      <div id="main-joueur">
        <button id="btn-coeur" class="bouton-carte rouge" onclick="envoyerChoix('coeur')">♥</button>
        <button id="btn-carreau" class="bouton-carte rouge" onclick="envoyerChoix('carreau')">♦</button>
        <button id="btn-trefle" class="bouton-carte noir" onclick="envoyerChoix('trefle')">♣</button>
        <button id="btn-pique" class="bouton-carte noir" onclick="envoyerChoix('pique')">♠</button>
      </div>
    </div>
  </div>

  <script>
    const protocole = window.location.protocol === "https:" ? "wss:" : "ws:";
    const ws = new WebSocket(`${protocole}//${window.location.host}/ws`);
    let monPseudo = "";

    function rejoindrePartie() {
      const saisie = document.getElementById("champ-pseudo").value.trim();
      if (!saisie) {
        alert("Veuillez entrer un pseudo.");
        return;
      }
      monPseudo = saisie;

      if (ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ action: "rejoindre", pseudo: monPseudo }));
        // Bascule vers l'écran de jeu
        document.getElementById("ecran-connexion").style.display = "none";
        document.getElementById("ecran-jeu").style.display = "flex";
      } else {
        alert("Connexion au serveur en cours, réessayez dans une seconde.");
      }
    }

    ws.onmessage = (event) => {
      const donnees = JSON.parse(event.data);

      // Mise à jour de la liste des joueurs
      if (donnees.type === "liste_joueurs") {
        const ul = document.getElementById("liste-joueurs");
        const compteur = document.getElementById("compteur-joueurs");
        ul.innerHTML = "";
        compteur.textContent = donnees.joueurs.length;

        donnees.joueurs.forEach(pseudo => {
          const li = document.createElement("li");
          li.textContent = pseudo === monPseudo ? `${pseudo} (Moi)` : pseudo;
          ul.appendChild(li);
        });
      }

      // Mise à jour de la carte au centre
      if (donnees.type === "carte") {
        afficherCarte(donnees.valeur);
        if (donnees.par) {
          document.getElementById("info-action").textContent = `Dernière carte posée par ${donnees.par}`;
        }
      }
    };

    function envoyerChoix(nomCarte) {
      if (ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ action: "jouer_carte", valeur: nomCarte }));
      }
    }

    function afficherCarte(nomCarte) {
      document.querySelectorAll('.carte').forEach(c => c.classList.remove('visible'));
      document.querySelectorAll('.bouton-carte').forEach(b => b.classList.remove('actif'));

      const carteCible = document.getElementById('carte-' + nomCarte);
      if (carteCible) {
        void carteCible.offsetWidth;
        carteCible.classList.add('visible');
      }

      const boutonCible = document.getElementById('btn-' + nomCarte);
      if (boutonCible) {
        boutonCible.classList.add('actif');
      }
    }
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Duel 64 Cartes</title>
  <style>
    body {
      background-color: #2e7d32;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 30px 20px;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    #ecran-bloque {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-color: rgba(20, 20, 20, 0.95);
      color: white;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      z-index: 100;
      padding: 20px;
      box-sizing: border-box;
    }

    #ecran-bloque h1 { color: #ef5350; margin-bottom: 10px; }

    #en-tete {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    #badge-role {
      background-color: #ffd54f;
      color: #212121;
      font-weight: bold;
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 16px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }

    #info-action {
      color: white;
      background: rgba(0, 0, 0, 0.3);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 14px;
    }

    #tapis-de-jeu {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-grow: 1;
      width: 100%;
    }

    .carte {
      display: none; 
      width: 160px;
      height: 230px;
      background-color: #ffffff;
      border-radius: 14px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.35);
      justify-content: center;
      align-items: center;
    }

    .carte.visible {
      display: flex;
      animation: poserCarte 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes poserCarte {
      from { transform: translateY(30px) scale(1.15); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }

    .rouge { color: #d32f2f; }
    .noir { color: #212121; }

    .symbole { font-size: 90px; line-height: 1; user-select: none; }
    #carte-coeur .symbole::before { content: "♥"; }
    #carte-carreau .symbole::before { content: "♦"; }
    #carte-trefle .symbole::before { content: "♣"; }
    #carte-pique .symbole::before { content: "♠"; }

    #carte-dos {
      background-color: #1565c0;
      border: 7px solid #ffffff;
      box-sizing: border-box;
      background-image: repeating-linear-gradient(
        45deg, rgba(255, 255, 255, 0.15) 0px, rgba(255, 255, 255, 0.15) 10px,
        transparent 10px, transparent 20px
      ),
      repeating-linear-gradient(
        -45deg, rgba(255, 255, 255, 0.15) 0px, rgba(255, 255, 255, 0.15) 10px,
        transparent 10px, transparent 20px
      );
    }

    /* Main du joueur avec compteurs au-dessus de chaque carte */
    #main-joueur {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .emplacement-carte {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .compteur-carte {
      background-color: rgba(0, 0, 0, 0.45);
      color: #ffffff;
      font-weight: bold;
      font-size: 16px;
      padding: 4px 14px;
      border-radius: 12px;
      min-width: 24px;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .bouton-carte {
      width: 90px;
      height: 130px;
      background-color: #ffffff;
      border: none;
      border-radius: 10px;
      box-shadow: 0 5px 10px rgba(0, 0, 0, 0.25);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 48px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
    }

    .bouton-carte:hover:not(:disabled) {
      transform: translateY(-12px);
      box-shadow: 0 12px 18px rgba(0, 0, 0, 0.35);
    }

    .bouton-carte:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .bouton-carte.actif {
      outline: 3px solid #ffd54f;
      transform: translateY(-8px);
    }
  </style>
</head>
<body>

  <div id="ecran-bloque">
    <h1>Accès bloqué</h1>
    <p id="texte-blocage">La salle est pleine (2/2 joueurs connectés).</p>
    <p style="font-size: 14px; color: #aaa;">Veuillez patienter qu'un joueur quitte la partie puis rechargez la page.</p>
  </div>

  <div id="en-tete">
    <div id="badge-role">Connexion au serveur...</div>
    <div id="info-action">En attente...</div>
  </div>

  <div id="tapis-de-jeu">
    <div id="carte-coeur" class="carte rouge"><div class="symbole"></div></div>
    <div id="carte-carreau" class="carte rouge"><div class="symbole"></div></div>
    <div id="carte-trefle" class="carte noir"><div class="symbole"></div></div>
    <div id="carte-pique" class="carte noir"><div class="symbole"></div></div>
    <div id="carte-dos" class="carte"></div>
  </div>

  <!-- Cartes cliquables avec le nombre au-dessus de chacune -->
  <div id="main-joueur">
    <div class="emplacement-carte">
      <span id="compte-coeur" class="compteur-carte">0</span>
      <button id="btn-coeur" class="bouton-carte rouge" onclick="envoyerChoix('coeur')" disabled>♥</button>
    </div>

    <div class="emplacement-carte">
      <span id="compte-carreau" class="compteur-carte">0</span>
      <button id="btn-carreau" class="bouton-carte rouge" onclick="envoyerChoix('carreau')" disabled>♦</button>
    </div>

    <div class="emplacement-carte">
      <span id="compte-trefle" class="compteur-carte">0</span>
      <button id="btn-trefle" class="bouton-carte noir" onclick="envoyerChoix('trefle')" disabled>♣</button>
    </div>

    <div class="emplacement-carte">
      <span id="compte-pique" class="compteur-carte">0</span>
      <button id="btn-pique" class="bouton-carte noir" onclick="envoyerChoix('pique')" disabled>♠</button>
    </div>
  </div>

  <script>
    const protocole = window.location.protocol === "https:" ? "wss:" : "ws:";
    const ws = new WebSocket(`${protocole}//${window.location.host}/ws`);
    
    const badgeRole = document.getElementById("badge-role");
    const infoAction = document.getElementById("info-action");
    let duelActif = false;
    let maMain = { coeur: 0, carreau: 0, trefle: 0, pique: 0 };

    function mettreAJourBoutons() {
      const types = ["coeur", "carreau", "trefle", "pique"];
      types.forEach(type => {
        const nb = maMain[type];
        document.getElementById("compte-" + type).textContent = nb;
        // Le bouton est actif uniquement si le duel est en cours ET qu'il reste au moins 1 carte
        document.getElementById("btn-" + type).disabled = !(duelActif && nb > 0);
      });
    }

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);

      if (data.type === "complet") {
        document.getElementById("texte-blocage").textContent = data.message;
        document.getElementById("ecran-bloque").style.display = "flex";
        duelActif = false;
        mettreAJourBoutons();
      }

      else if (data.type === "attribution") {
        badgeRole.textContent = (data.role === "J1") ? "Vous êtes le Joueur 1" : "Vous êtes le Joueur 2";
        afficherCarte(data.carte);
      }

      else if (data.type === "maj_main") {
        maMain = data.main;
        mettreAJourBoutons();
      }

      else if (data.type === "statut_salle") {
        if (data.nb_joueurs < 2) {
          duelActif = false;
          maMain = { coeur: 0, carreau: 0, trefle: 0, pique: 0 };
          infoAction.textContent = "En attente de l'autre joueur (1/2)...";
          afficherCarte("dos");
        } else {
          duelActif = true;
          infoAction.textContent = "Duel prêt (2/2) ! 32 cartes distribuées à chacun.";
        }
        mettreAJourBoutons();
      }

      else if (data.type === "carte") {
        afficherCarte(data.valeur);
        const totalRestant = maMain.coeur + maMain.carreau + maMain.trefle + maMain.pique;
        infoAction.textContent = `Carte posée par ${data.par} (Il vous reste ${totalRestant} cartes)`;
      }
    };

    ws.onclose = () => {
      if (document.getElementById("ecran-bloque").style.display !== "flex") {
        badgeRole.textContent = "Déconnecté du serveur";
        badgeRole.style.backgroundColor = "#ef5350";
        badgeRole.style.color = "white";
        duelActif = false;
        mettreAJourBoutons();
      }
    };

    function envoyerChoix(nomCarte) {
      if (ws.readyState === WebSocket.OPEN && duelActif && maMain[nomCarte] > 0) {
        ws.send(JSON.stringify({ action: "jouer_carte", valeur: nomCarte }));
      }
    }

    function afficherCarte(nomCarte) {
      document.querySelectorAll('.carte').forEach(c => c.classList.remove('visible'));
      document.querySelectorAll('.bouton-carte').forEach(b => b.classList.remove('actif'));

      const carteCible = document.getElementById('carte-' + nomCarte);
      if (carteCible) {
        void carteCible.offsetWidth;
        carteCible.classList.add('visible');
      }

      const boutonCible = document.getElementById('btn-' + nomCarte);
      if (boutonCible) {
        boutonCible.classList.add('actif');
      }
    }
  </script>

</body>
</html>
